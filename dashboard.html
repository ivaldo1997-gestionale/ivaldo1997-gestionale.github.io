<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITA Srl — Gestionale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a1a2e;
      --navy-light: #24244a;
      --gold: #e8c44a;
      --gold-light: #f5e08a;
      --bg: #f0f2f7;
      --white: #ffffff;
      --border: #dde3ef;
      --text: #1a1a2e;
      --muted: #6b7a99;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --sidebar-w: 220px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--navy);
      min-height: 100vh;
      position: fixed;
      left: 0; top: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo .nome {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .sidebar-logo .sub {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    .sidebar-section {
      padding: 16px 12px 8px;
    }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
      text-decoration: none;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: white; }
    .nav-item.active { background: var(--gold); color: var(--navy); font-weight: 700; }
    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-item .badge {
      margin-left: auto;
      background: var(--red);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }
    .nav-item.active .badge { background: var(--navy); color: white; }

    .nav-item.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .nav-item.disabled:hover { background: none; color: rgba(255,255,255,0.6); }
    .nav-item .presto {
      margin-left: auto;
      font-size: 9px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }

    .btn-home {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 8px;
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
      margin: 8px 12px 0;
    }
    .btn-home:hover { background: rgba(255,255,255,0.07); color: white; }

    /* PULSANTE COPIA LINK */
    .btn-copia-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: rgba(232,196,74,0.1);
      width: calc(100% - 24px);
      margin: 4px 12px 0;
      transition: all 0.15s;
      text-align: left;
    }
    .btn-copia-link:hover { background: rgba(232,196,74,0.2); }
    .btn-copia-link.copiato { background: rgba(34,197,94,0.15); color: #4ade80; }

    /* TEMA SWITCHER */
    .tema-section {
      padding: 10px 12px 0;
    }
    .tema-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 7px;
      padding: 0 2px;
    }
    .tema-swatches {
      display: flex;
      gap: 8px;
      padding: 0 2px;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all 0.15s;
      position: relative;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.attivo { border-color: white; }
    .swatch[data-tema="navy"]   { background: #1a1a2e; }
    .swatch[data-tema="ardesia"]{ background: #2d3748; }
    .swatch[data-tema="foresta"]{ background: #1a3a2a; }

    /* ===================== MAIN ===================== */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .topbar-subtitle { font-size: 13px; color: var(--muted); margin-top: 1px; }

    .topbar-actions { display: flex; gap: 10px; align-items: center; }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--navy); color: white; }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-outline { background: white; color: var(--text); border: 1.5px solid var(--border); }
    .btn-outline:hover { border-color: var(--navy); }
    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-gold:hover { background: var(--gold-light); }

    .content { padding: 24px 28px; flex: 1; }

    /* ===================== PIPELINE ===================== */
    .pipeline-wrap {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .colonna {
      min-width: 260px;
      flex: 1;
      background: white;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 160px);
    }

    .colonna-header {
      padding: 14px 16px;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: white;
      border-radius: 12px 12px 0 0;
    }
    .colonna-nome {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .colonna-count {
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .colonna-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ===================== CARD LEAD ===================== */
    .card {
      background: #fafbfd;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .card:hover { border-color: var(--navy); background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
    .card-nome { font-size: 14px; font-weight: 700; color: var(--text); }
    .card-data { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .card-scoring { font-size: 18px; }

    .card-info { display: flex; flex-direction: column; gap: 4px; }
    .card-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .card-problema {
      font-size: 12px;
      color: var(--text);
      background: var(--bg);
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* ===================== VUOTO ===================== */
    .colonna-vuota {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      gap: 6px;
    }
    .colonna-vuota .ico { font-size: 24px; opacity: 0.4; }

    /* ===================== LOADING ===================== */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--muted);
      font-size: 14px;
      gap: 10px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===================== MODALE ===================== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .overlay.aperta { display: flex; }

    .modale {
      width: 420px;
      max-width: 100%;
      background: white;
      height: 100vh;
      overflow-y: auto;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }

    .modale-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }
    .modale-titolo { font-size: 16px; font-weight: 700; }
    .btn-chiudi {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      line-height: 1;
    }

    .modale-body { padding: 20px 24px; flex: 1; }

    .campo-modale { margin-bottom: 18px; }
    .campo-modale label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .campo-modale .valore {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
    }

    .sezione-modale {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      margin: 20px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .modale-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      bottom: 0;
      background: white;
    }

    select.stato-select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: white;
      cursor: pointer;
    }
    select.stato-select:focus { outline: none; border-color: var(--navy); }

    .badge-scoring {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-verde { background: #dcfce7; color: #166534; }
    .badge-giallo { background: #fef9c3; color: #854d0e; }
    .badge-rosso { background: #fee2e2; color: #991b1b; }
    .badge-default { background: var(--bg); color: var(--muted); }

    /* ===================== FILTRI ===================== */
    .filtri {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filtro-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--muted);
      transition: all 0.15s;
    }
    .filtro-btn:hover { border-color: var(--navy); color: var(--text); }
    .filtro-btn.attivo { background: var(--navy); color: white; border-color: var(--navy); }

    .cerca {
      padding: 6px 12px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      color: var(--text);
      margin-left: auto;
    }
    .cerca:focus { border-color: var(--navy); }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="nome">I.T.A. SRL</div>
    <div class="sub">Gestionale operativo</div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Commerciale</div>
    <div class="nav-item active" onclick="mostraModulo('pipeline')">
      <span class="icon">📋</span> Pipeline Lead
      <span class="badge" id="badge-nuovi">0</span>

    <div class="nav-item disabled" title="Prossimamente">

  <div class="sidebar-section">

    <div class="nav-item disabled" title="Prossimamente">

      <span class="presto">presto</span>
    </div>
    <div class="nav-item disabled" title="Prossimamente">

      <span class="presto">presto</span>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Amministrativo</div>
    <div class="nav-item disabled" title="Prossimamente">
      <span class="icon">🧾</span> Fatturazione
      <span class="presto">presto</span>
    </div>
    <div class="nav-item disabled" title="Prossimamente">
      <span class="icon">📊</span> Report
      <span class="presto">presto</span>
    </div>
  </div>

  <button class="btn-copia-link" id="btnCopiaLink" onclick="copiaLinkForm()">

  </button>

  <a href="index.html" class="btn-home">
    <span>🏠</span> Menu principale
  </a>

  <div class="tema-section">

    <div class="tema-swatches">
      <div class="swatch attivo" data-tema="navy"    title="Navy"    onclick="cambiaTema('navy',    this)"></div>
      <div class="swatch"        data-tema="ardesia"  title="Ardesia"  onclick="cambiaTema('ardesia',  this)"></div>
      <div class="swatch"        data-tema="foresta"  title="Foresta"  onclick="cambiaTema('foresta',  this)"></div>

  <div class="sidebar-footer">
    v1.0 · Maggio 2026
  </div>
</nav>

<!-- ===================== MAIN ===================== -->
<div class="main">

  <div class="topbar">
    <div>
      <div class="topbar-title">Pipeline Lead</div>
      <div class="topbar-subtitle" id="topbar-sub">Caricamento in corso…</div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-outline" onclick="caricaLead()">↻ Aggiorna</button>
      <button class="btn btn-gold" onclick="apriForm()">+ Nuovo lead</button>
    </div>
  </div>

  <div class="content">

    <!-- FILTRI -->
    <div class="filtri">
      <button class="filtro-btn attivo" onclick="filtra('tutti', this)">Tutti</button>
      <button class="filtro-btn" onclick="filtra('verde', this)">🟢 Verdi</button>
      <button class="filtro-btn" onclick="filtra('giallo', this)">🟡 Gialli</button>
      <button class="filtro-btn" onclick="filtra('rosso', this)">🔴 Rossi</button>
      <input class="cerca" type="text" placeholder="🔍 Cerca per nome o zona…" oninput="cercaLead(this.value)">
    </div>

    <!-- PIPELINE -->
    <div id="pipeline" class="pipeline-wrap">
      <div class="loading"><div class="spinner"></div> Caricamento lead…</div>
    </div>

  </div>
</div>

<!-- ===================== MODALE DETTAGLIO ===================== -->
<div class="overlay" id="overlay" onclick="chiudiModaleSeFuori(event)">
  <div class="modale" id="modale">
    <div class="modale-header">
      <div class="modale-titolo" id="modale-titolo">Lead</div>
      <button class="btn-chiudi" onclick="chiudiModale()">✕</button>
    </div>
    <div class="modale-body" id="modale-body"></div>
    <div class="modale-footer">
      <select class="stato-select" id="stato-select" onchange="aggiornaScoringUI()">
        <option value="Nuovo">📥 Nuovo</option>
        <option value="Contattato">📞 Contattato</option>
        <option value="Sopralluogo">🔍 Sopralluogo fissato</option>
        <option value="Preventivo">📄 Preventivo inviato</option>
        <option value="Accettato">✅ Accettato</option>
        <option value="Chiuso">❌ Chiuso</option>
      </select>
      <button class="btn btn-primary" style="width:100%" onclick="salvaAggiornamento()">Salva modifiche</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  //  CONFIGURAZIONE
  // ============================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxueMtwceichcj3gk7_OLvVRgFpwWNWt0hk565lrHRwR1B9CYi0D63wL2ptdaSdqA9Xpw/exec";
  const FORM_URL = "https://ivaldo1997-gestionale.github.io/form.html";

  // Fasi della pipeline
  const FASI = [
    { id: "Nuovo",       label: "Nuovi Lead",         icon: "📥" },
    { id: "Contattato",  label: "Contattati",          icon: "📞" },
    { id: "Sopralluogo", label: "Sopralluogo",          icon: "🔍" },
    { id: "Preventivo",  label: "Preventivo inviato",  icon: "📄" },
    { id: "Accettato",   label: "Accettati",           icon: "✅" },
  ];

  // ============================================================
  //  STATO
  // ============================================================
  let tuttiLead = [];
  let leadFiltrati = [];
  let leadCorrente = null;
  let filtroAttivo = 'tutti';
  let ricercaAttiva = '';

  // ============================================================
  //  CARICAMENTO LEAD
  // ============================================================
  async function caricaLead() {
    document.getElementById('pipeline').innerHTML =
      '<div class="loading"><div class="spinner"></div> Caricamento lead…</div>';

    try {
      const url = APPS_SCRIPT_URL + '?action=getAllLead&t=' + Date.now();
      const script = document.createElement('script');
      const callbackName = 'cb_' + Date.now();

      const dati = await new Promise((resolve, reject) => {
        window[callbackName] = (d) => { delete window[callbackName]; resolve(d); };

        // Usa iframe GET — stesso metodo del form
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.name = callbackName;
        document.body.appendChild(iframe);

        fetch(url, { mode: 'no-cors' }).catch(() => {});

        // Fallback: carica via script tag (JSONP-style non supportato, usiamo fetch diretto)
        fetch(url)
          .then(r => r.json())
          .then(d => { delete window[callbackName]; document.body.removeChild(iframe); resolve(d); })
          .catch(() => {
            // Riprova senza CORS
            document.body.removeChild(iframe);
            resolve({ success: true, lead: [] });
          });
      });

      tuttiLead = (dati.lead || dati.Lead || dati.principio || []).map(normalizzaLead);
      applicaFiltri();
      aggiornaContatori();

    } catch (err) {
      document.getElementById('pipeline').innerHTML =
        '<div class="loading">⚠️ Errore di connessione. <button class="btn btn-outline" style="margin-left:10px" onclick="caricaLead()">Riprova</button></div>';
    }
  }

  function normalizzaLead(r) {
    return {
      id: r['ID'] || r['id'] || '',
      nome: r['Nome'] || '',
      cognome: r['Cognome'] || '',
      telefono: r['Telefono'] || '',
      canale: r['Canale Preferito'] || '',
      email: r['Email'] || '',
      zona: r['Zona'] || '',
      problema: r['Problema Principale'] || '',
      durata: r['Durata Problema'] || '',
      proprietario: r['Proprietario'] || '',
      piano: r['Piano'] || '',
      anno: r['Anno Edificio'] || '',
      stanze: r['Stanze Coinvolte'] || '',
      pareti: r['Pareti Doppie'] || '',
      ater: r['Flag ATER'] || 'No',
      pianoterra: r['Flag Piano Terra'] || 'No',
      budget: r['Budget Orientativo'] || '',
      urgenza: r['Urgenza'] || '',
      scoring: r['Scoring'] || '🟡 Da valutare',
      note: r['Note Monica'] || '',
      stato: r['Stato'] || 'Nuovo',
      data: r['Data Chiamata'] || '',
    };
  }

  // ============================================================
  //  FILTRI E RICERCA
  // ============================================================
  function filtra(tipo, btn) {
    filtroAttivo = tipo;
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('attivo'));
    btn.classList.add('attivo');
    applicaFiltri();
  }

  function cercaLead(testo) {
    ricercaAttiva = testo.toLowerCase();
    applicaFiltri();
  }

  function applicaFiltri() {
    leadFiltrati = tuttiLead.filter(l => {
      const passaFiltro =
        filtroAttivo === 'tutti' ||
        (filtroAttivo === 'verde' && l.scoring.includes('🟢')) ||
        (filtroAttivo === 'giallo' && (l.scoring.includes('🟡') || l.scoring.includes('Da valutare'))) ||
        (filtroAttivo === 'rosso' && l.scoring.includes('🔴'));

      const passaRicerca = !ricercaAttiva ||
        (l.nome + ' ' + l.cognome + ' ' + l.zona).toLowerCase().includes(ricercaAttiva);

      return passaFiltro && passaRicerca;
    });

    renderPipeline();
  }

  // ============================================================
  //  RENDER PIPELINE
  // ============================================================
  function renderPipeline() {
    const container = document.getElementById('pipeline');
    container.innerHTML = '';

    FASI.forEach(fase => {
      const leadFase = leadFiltrati.filter(l =>
        (l.stato || 'Nuovo') === fase.id ||
        (fase.id === 'Nuovo' && !l.stato)
      );

      const col = document.createElement('div');
      col.className = 'colonna';
      col.innerHTML = `
        <div class="colonna-header">
          <div class="colonna-nome">${fase.icon} ${fase.label}</div>
          <div class="colonna-count">${leadFase.length}</div>
        </div>
        <div class="colonna-body" id="col-${fase.id}">
          ${leadFase.length === 0
            ? `<div class="colonna-vuota"><div class="ico">—</div><div>Nessun lead</div></div>`
            : leadFase.map(cardHTML).join('')
          }
        </div>
      `;
      container.appendChild(col);
    });
  }

  function cardHTML(lead) {
    const scoring = badgeScoring(lead.scoring);
    const nomeCompleto = (lead.nome + ' ' + lead.cognome).trim() || 'Senza nome';
    const data = lead.data ? lead.data.split(' ')[0] : '';

    return `
      <div class="card" onclick="apriModale('${lead.id}')">
        <div class="card-header">
          <div>
            <div class="card-nome">${nomeCompleto}</div>
            <div class="card-data">${data}</div>
          </div>
          <div class="card-scoring">${scoringEmoji(lead.scoring)}</div>
        </div>
        <div class="card-info">
          ${lead.zona ? `<span class="card-tag">📍 ${lead.zona}</span>` : ''}
          ${lead.urgenza ? `<span class="card-tag">⏰ ${lead.urgenza}</span>` : ''}
          ${lead.ater === 'Sì' ? `<span class="card-tag" style="color:#e05555">⚠️ ATER</span>` : ''}
          ${lead.pianoterra === 'Sì' ? `<span class="card-tag" style="color:#f59e0b">🏠 Piano terra</span>` : ''}
        </div>
        ${lead.problema ? `<div class="card-problema">${lead.problema}</div>` : ''}
      </div>
    `;
  }

  function scoringEmoji(scoring) {
    if (scoring.includes('🟢')) return '🟢';
    if (scoring.includes('🔴')) return '🔴';
    return '🟡';
  }

  function badgeScoring(scoring) {
    if (scoring.includes('🟢')) return '<span class="badge-scoring badge-verde">🟢 Verde</span>';
    if (scoring.includes('🔴')) return '<span class="badge-scoring badge-rosso">🔴 Rosso</span>';
    return '<span class="badge-scoring badge-giallo">🟡 Giallo</span>';
  }

  // ============================================================
  //  CONTATORI
  // ============================================================
  function aggiornaContatori() {
    const nuovi = tuttiLead.filter(l => !l.stato || l.stato === 'Nuovo').length;
    const badge = document.getElementById('badge-nuovi');
    badge.textContent = nuovi;
    badge.style.display = nuovi > 0 ? 'block' : 'none';

    const data = new Date().toLocaleDateString('it-IT');
    document.getElementById('topbar-sub').textContent =
      `${tuttiLead.length} lead totali · aggiornato il ${data}`;
  }

  // ============================================================
  //  MODALE DETTAGLIO
  // ============================================================
  function apriModale(id) {
    leadCorrente = tuttiLead.find(l => l.id === id);
    if (!leadCorrente) return;

    document.getElementById('modale-titolo').textContent =
      (leadCorrente.nome + ' ' + leadCorrente.cognome).trim() || 'Lead';

    document.getElementById('modale-body').innerHTML = `
      <div>${badgeScoring(leadCorrente.scoring)}</div>

      <div class="sezione-modale">Contatto</div>
      ${riga('Nome', leadCorrente.nome + ' ' + leadCorrente.cognome)}
      ${riga('Telefono', leadCorrente.telefono)}
      ${riga('Canale preferito', leadCorrente.canale)}
      ${leadCorrente.email ? riga('Email', leadCorrente.email) : ''}

      <div class="sezione-modale">Il problema</div>
      ${riga('Problema', leadCorrente.problema)}
      ${riga('Da quanto tempo', leadCorrente.durata)}

      <div class="sezione-modale">L'immobile</div>
      ${riga('Zona', leadCorrente.zona)}
      ${riga('Piano', leadCorrente.piano)}
      ${riga('Anno edificio', leadCorrente.anno)}
      ${riga('Stanze coinvolte', leadCorrente.stanze)}
      ${riga('Pareti doppie', leadCorrente.pareti)}
      ${leadCorrente.ater === 'Sì' ? `<div style="background:#fee2e2;padding:8px 10px;border-radius:8px;font-size:13px;color:#991b1b;margin-bottom:10px;">⚠️ Immobile ATER — verificare autorizzazione</div>` : ''}
      ${leadCorrente.pianoterra === 'Sì' ? `<div style="background:#fef9c3;padding:8px 10px;border-radius:8px;font-size:13px;color:#854d0e;margin-bottom:10px;">🏠 Piano terra — foto pareti obbligatorie</div>` : ''}

      <div class="sezione-modale">Budget e urgenza</div>
      ${riga('Budget orientativo', leadCorrente.budget)}
      ${riga('Urgenza', leadCorrente.urgenza)}
      ${riga('Proprietà', leadCorrente.proprietario)}

      ${leadCorrente.note ? `
        <div class="sezione-modale">Note Monica</div>
        ${riga('Note', leadCorrente.note)}
      ` : ''}

      <div class="sezione-modale">Stato attuale</div>
    `;

    const sel = document.getElementById('stato-select');
    sel.value = leadCorrente.stato || 'Nuovo';

    document.getElementById('overlay').classList.add('aperta');
  }

  function riga(label, valore) {
    if (!valore || valore.toString().trim() === '') return '';
    return `
      <div class="campo-modale">
        <label>${label}</label>
        <div class="valore">${valore}</div>
      </div>
    `;
  }

  function chiudiModale() {
    document.getElementById('overlay').classList.remove('aperta');
    leadCorrente = null;
  }

  function chiudiModaleSeFuori(e) {
    if (e.target === document.getElementById('overlay')) chiudiModale();
  }

  function aggiornaScoringUI() {}

  // ============================================================
  //  SALVA AGGIORNAMENTO
  // ============================================================
  async function salvaAggiornamento() {
    if (!leadCorrente) return;

    const nuovoStato = document.getElementById('stato-select').value;
    const btn = document.querySelector('.modale-footer .btn-primary');
    btn.textContent = 'Salvataggio…';
    btn.disabled = true;

    try {
      const payload = {
        action: 'aggiornaLead',
        id: leadCorrente.id,
        stato: nuovoStato
      };

      await inviaAggiornamento(payload);

      // Aggiorna localmente
      leadCorrente.stato = nuovoStato;
      const idx = tuttiLead.findIndex(l => l.id === leadCorrente.id);
      if (idx !== -1) tuttiLead[idx].stato = nuovoStato;

      applicaFiltri();
      aggiornaContatori();
      chiudiModale();

    } catch (err) {
      alert('Errore nel salvataggio. Riprova.');
    } finally {
      btn.textContent = 'Salva modifiche';
      btn.disabled = false;
    }
  }

  function inviaAggiornamento(dati) {
    return new Promise((resolve) => {
      const iframe = document.createElement('iframe');
      iframe.name = 'iframe_agg_' + Date.now();
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      const form = document.createElement('form');
      form.method = 'GET';
      form.action = APPS_SCRIPT_URL;
      form.target = iframe.name;

      Object.entries(dati).forEach(([k, v]) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k === 'action' ? 'action' : 'payload';
        if (k !== 'action') {
          // invia come payload JSON
          const existing = form.querySelector('[name="payload"]');
          if (!existing) {
            input.value = encodeURIComponent(JSON.stringify(dati));
            form.appendChild(input);
          }
          return;
        }
        input.value = v;
        form.appendChild(input);
      });

      document.body.appendChild(form);

      let risolto = false;
      iframe.onload = () => { if (!risolto) { risolto = true; resolve(); } };
      setTimeout(() => { if (!risolto) { risolto = true; resolve(); } }, 5000);

      form.submit();
      document.body.removeChild(form);
    });
  }

  // ============================================================
  //  NAVIGAZIONE MODULI
  // ============================================================
  function mostraModulo(modulo) {
    // Punto di espansione per futuri moduli
    console.log('Modulo:', modulo);
  }

  function apriForm() {
    window.open(FORM_URL, '_blank');
  }

  // ============================================================
  //  COPIA LINK QUESTIONARIO
  // ============================================================
  function copiaLinkForm() {
    const btn = document.getElementById('btnCopiaLink');
    navigator.clipboard.writeText(FORM_URL).then(() => {
      btn.classList.add('copiato');
      btn.innerHTML = '<span>✓</span> Link copiato!';
      setTimeout(() => {
        btn.classList.remove('copiato');
        btn.innerHTML = '<span>📋</span> Copia link questionario';
      }, 2500);
    }).catch(() => {
      // Fallback per browser vecchi
      prompt('Copia questo link:', FORM_URL);
    });
  }

  // ============================================================
  //  SELETTORE TEMA
  // ============================================================
  const TEMI = {
    navy: {
      '--navy':      '#1a1a2e',
      '--navy-light':'#24244a',
      '--gold':      '#e8c44a',
      '--gold-light':'#f5e08a',
      '--bg':        '#f0f2f7',
    },
    ardesia: {
      '--navy':      '#2d3748',
      '--navy-light':'#3d4a5c',
      '--gold':      '#f6ad55',
      '--gold-light':'#fbd38d',
      '--bg':        '#f7f8fa',
    },
    foresta: {
      '--navy':      '#1a3a2a',
      '--navy-light':'#254d38',
      '--gold':      '#68d391',
      '--gold-light':'#9ae6b4',
      '--bg':        '#f0f7f4',
    },
  };

  function cambiaTema(nome, el) {
    const tema = TEMI[nome];
    if (!tema) return;
    const root = document.documentElement;
    Object.entries(tema).forEach(([k, v]) => root.style.setProperty(k, v));
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('attivo'));
    el.classList.add('attivo');
    localStorage.setItem('ita-tema', nome);
  }

  function applicaTemaIniziale() {
    const salvato = localStorage.getItem('ita-tema') || 'navy';
    const swatch = document.querySelector(`.swatch[data-tema="${salvato}"]`);
    if (swatch) cambiaTema(salvato, swatch);
  }

  // ============================================================
  //  AVVIO
  // ============================================================
  applicaTemaIniziale();
  caricaLead();
</script>
</body>
</html>
